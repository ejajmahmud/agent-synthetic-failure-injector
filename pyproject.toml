[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-synthetic-failure-injector"
version = "0.1.0"
description = "Chaos engineering harness injecting latency, network drops, and schema mutations into tool responses to test agent resilience"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-synthetic-failure-injector = "agent_synthetic_failure_injector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_synthetic_failure_injector*"]
